<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DRLUXUR — Coming Soon</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8f6f2;
      font-family: Arial, Helvetica, sans-serif;
      color: #111;
      overflow: hidden;
    }

    .container {
      text-align: center;
      padding: 40px;
    }

    .logo {
      font-size: 42px;
      font-weight: 700;
      letter-spacing: 8px;
      margin-bottom: 24px;
    }

    .line {
      width: 80px;
      height: 2px;
      background: #111;
      margin: 0 auto 30px;
      opacity: 0.2;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 14px;
      font-weight: 600;
    }

    p {
      font-size: 16px;
      color: #555;
      max-width: 500px;
      line-height: 1.7;
    }

    .glow {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(0,0,0,0.04), transparent 70%);
      border-radius: 50%;
      z-index: -1;
    }

    @media (max-width: 600px) {
      .logo {
        font-size: 30px;
        letter-spacing: 5px;
      }

      h1 {
        font-size: 24px;
      }

      p {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <div class="glow"></div>

  <div class="container">
    <div class="logo">DRLUXUR</div>

    <div class="line"></div>

    <h1>Under Construction</h1>

    <p>
      We’re working behind the scenes to bring something exceptional.  
      Our experience will be live shortly.
    </p>
  </div>
</body>
</html>
